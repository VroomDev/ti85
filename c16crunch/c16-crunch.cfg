# Commodore 16 Crunch — 16KB, kernal banked in
#
# $1001     BASIC stub + CODE + RODATA (must end before charset)
# $2000     charset RAM — PRG pad, filled at runtime from ROM + tiles
# $2800     playfield — PRG pad, filled by load_level
# $2A00     CODEHI (optional) then BSS, up to $4000
#
# The pads exist so a single contiguous PRG can place code in upper RAM.
# init_graphics / load_level overwrite $2000–$29FF after load.

FEATURES {
    STARTADDRESS: default = $1001;
}
SYMBOLS {
    __LOADADDR__: type = import;
}
# ZP: only (ptr),y pointers at $D8+ (not BASIC $02-$1B)
MEMORY {
    ZP:       file = "", start = $00D8, size = $0010, define = yes;
    LOADADDR: file = %O, start = %S - 2, size = $0002;
    MAIN:     file = %O, start = $1001, size = $2000 - $1001, fill = yes, fillval = 0;
    CHARPAD:  file = %O, start = $2000, size = $0800, fill = yes, fillval = 0;
    FIELD:    file = %O, start = $2800, size = $0200, fill = yes, fillval = 0;
    UPPER:    file = %O, start = $2A00, size = $4000 - $2A00;
}
SEGMENTS {
    ZEROPAGE:  load = ZP,       type = zp,  optional = yes;
    LOADADDR:  load = LOADADDR, type = ro;
    EXEHDR:    load = MAIN,    type = ro;
    CODE:      load = MAIN,    type = ro;
    RODATA:    load = MAIN,    type = ro;
    DATA:      load = MAIN,    type = rw,  optional = yes;
    PLAYFIELD: load = FIELD,   type = bss;
    CODEHI:    load = UPPER,   type = ro,  optional = yes;
    BSS:       load = UPPER,   type = bss, define = yes;
}
