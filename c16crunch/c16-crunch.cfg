# Commodore 16 Crunch — 16KB, kernal banked in
#
# $1001     BASIC stub + code + RODATA
# $2000     charset RAM (filled at runtime, not in the PRG)
# $2800     playfield (512 bytes)
# $2A00     BSS, including the maze stack, up to $4000

FEATURES {
    STARTADDRESS: default = $1001;
}
SYMBOLS {
    __LOADADDR__: type = import;
}
MEMORY {
    ZP:       file = "", start = $0002, size = $001A, define = yes;
    LOADADDR: file = %O, start = %S - 2, size = $0002;
    MAIN:     file = %O, start = $1001, size = $2000 - $1001;
    FIELD:    file = "", start = $2800, size = $0200;
    RAM:      file = "", start = $2A00, size = $4000 - $2A00, define = yes;
}
SEGMENTS {
    ZEROPAGE:  load = ZP,       type = zp,  optional = yes;
    LOADADDR:  load = LOADADDR, type = ro;
    EXEHDR:    load = MAIN,    type = ro;
    CODE:      load = MAIN,    type = ro;
    RODATA:    load = MAIN,    type = ro;
    DATA:      load = MAIN,    type = rw,  optional = yes;
    PLAYFIELD: load = FIELD,   type = bss;
    BSS:       load = RAM,     type = bss, define = yes;
}
